<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FHD Video Screen</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--muted:#9299aa;--text:#f5f7fb;--accent:#6d5dfc;--border:#282d39}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:720px;margin:auto;padding:18px 16px 30px}h1{font-size:27px;margin:4px 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}.upload{display:block;border:1.5px dashed #4a5060;border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer}.upload strong{display:block;font-size:17px;margin-bottom:6px}.upload span{color:var(--muted);font-size:13px}input[type=file]{display:none}.preview{display:none;margin-top:14px}.preview video{width:100%;max-height:380px;border-radius:14px;background:#050609}.row{display:flex;gap:9px;flex-wrap:wrap}.chip{border:1px solid var(--border);background:#10131a;color:var(--text);padding:10px 13px;border-radius:12px;cursor:pointer}.chip.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer}.swatch.active{border-color:white;outline:2px solid var(--accent)}.custom{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:13px}.custom input{width:46px;height:38px;padding:2px;border:0;background:transparent}button.generate{width:100%;border:0;border-radius:14px;padding:14px;background:var(--accent);color:white;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.status{font-size:13px;color:var(--muted);margin-top:11px;text-align:center;min-height:18px}.hidden{display:none!important}.download{display:block;text-align:center;margin-top:12px;color:white;background:#242a38;border-radius:12px;padding:12px;text-decoration:none}
</style></head><body><main class="app"><h1>🎬 FHD Video Screen</h1><div class="sub">Select what stays visible and replace the rest with your chosen color.</div>
<section class="card"><label class="upload" for="videoFile"><strong>＋ Upload video</strong><span>MP4, MOV or WebM</span></label><input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/webm"><div id="preview" class="preview"><video id="video" controls playsinline></video></div></section>
<section id="options" class="card hidden"><h3>What should stay visible?</h3><div class="row" id="subjects"><button class="chip active" data-subject="person">👤 Person</button><button class="chip" data-subject="animal">🐕 Animal</button><button class="chip" data-subject="vehicle">🚗 Vehicle</button><button class="chip" data-subject="object">🎯 Selected object</button><button class="chip" data-subject="auto">✨ Auto detect</button></div></section>
<section id="colors" class="card hidden"><h3>Screen color</h3><div class="swatches" id="swatches"><button class="swatch active" style="background:#00ff00" data-color="#00ff00"></button><button class="swatch" style="background:#0066ff" data-color="#0066ff"></button><button class="swatch" style="background:#ff0000" data-color="#ff0000"></button><button class="swatch" style="background:#ffff00" data-color="#ffff00"></button><button class="swatch" style="background:#8b2cff" data-color="#8b2cff"></button><button class="swatch" style="background:#000" data-color="#000000"></button><button class="swatch" style="background:#fff" data-color="#ffffff"></button><button class="swatch" style="background:#ff4fa3" data-color="#ff4fa3"></button><button class="swatch" style="background:#ff7a00" data-color="#ff7a00"></button><button class="swatch" style="background:#00d9ff" data-color="#00d9ff"></button></div><label class="custom">Custom color <input id="customColor" type="color" value="#00ff00"></label></section>
<section id="action" class="card hidden"><button id="generate" class="generate">✨ Generate Video</button><div id="status" class="status"></div><a id="download" class="download hidden">⬇️ Download result</a></section></main>
<script>
const API=window.FHD_API_BASE||"";
const f=document.querySelector("#videoFile"),v=document.querySelector("#video"),p=document.querySelector("#preview"),o=document.querySelector("#options"),c=document.querySelector("#colors"),a=document.querySelector("#action"),s=document.querySelector("#status"),g=document.querySelector("#generate"),d=document.querySelector("#download");let url=null,subject="person",color="#00ff00";
f.onchange=()=>{let x=f.files&&f.files[0];if(!x)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(x);v.src=url;p.style.display="block";o.classList.remove("hidden");c.classList.remove("hidden");a.classList.remove("hidden");d.classList.add("hidden");s.textContent="Selected: "+x.name};
document.querySelector("#subjects").onclick=e=>{let b=e.target.closest(".chip");if(!b)return;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");subject=b.dataset.subject};
document.querySelector("#swatches").onclick=e=>{let b=e.target.closest(".swatch");if(!b)return;document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("active"));b.classList.add("active");color=b.dataset.color};
document.querySelector("#customColor").oninput=e=>{color=e.target.value;document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("active"))};
g.onclick=async()=>{let file=f.files&&f.files[0];if(!file)return;g.disabled=true;d.classList.add("hidden");s.textContent="Uploading…";
try{let fd=new FormData();fd.append("video",file);fd.append("subject",subject);fd.append("color",color);let r=await fetch(API+"/api/video-screen",{method:"POST",body:fd});let j=await r.json();if(!r.ok)throw Error(j.error||"Upload failed");let id=j.job_id;
for(;;){await new Promise(q=>setTimeout(q,1500));let q=await fetch(API+"/api/video-screen/"+id);let st=await q.json();if(st.status==="processing"||st.status==="queued"){s.textContent="Processing… "+(st.progress||0)+"%"}else if(st.status==="done"){s.textContent="Done ✓";d.href=API+st.file;d.classList.remove("hidden");break}else{throw Error(st.error||"Processing failed")}}}catch(e){s.textContent="Error: "+e.message}finally{g.disabled=false}};
</script></body></html>
